name: E2E

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: CLI E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
      - name: Test the compiled CLI
        run: just run apps/cli e2e
